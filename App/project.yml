name: Anima
options:
  bundleIdPrefix: com.joshuamoreno1
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  AnimaKit:
    path: ..
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
  # Meta Wearables DAT SDK (gafas, track G). Pin EXACTO calzado con la DAT app
  # instalada en las gafas (doc 05 §2.1): antes de bumpear, actualizar primero
  # la DAT app de las gafas. Solo se linkean Core + Display + Camera (MockDevice
  # JAMÁS en el target de producción: duplica clases objc).
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: "1.0.0"

schemes:
  Anima:
    build:
      targets:
        Anima: all
        AnimaUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: AnimaUITests
          parallelizable: false
          randomExecutionOrder: false

targets:
  Anima:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: .
        excludes:
          - project.yml
          - "*.template.plist"
          - "*.entitlements"
          - "*.xcconfig"
          - "Anima.xcodeproj"
          - "Skills"
          - "UITests"
          - "Widgets"
      # Skills de ejemplo (markdown portable, doc 05): folder reference en el
      # bundle; el shell los copia a Documents/skills al primer arranque.
      - path: Skills
        type: folder
        buildPhase: resources
    # MetaAppID / ClientToken del Wearables Developer Center: ver Glasses.xcconfig.
    configFiles:
      Debug: Glasses.xcconfig
      Release: Glasses.xcconfig
    dependencies:
      - package: AnimaKit
        product: AnimaKit
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseAuth
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATDisplay
      - package: MetaWearablesDAT
        product: MWDATCamera
      # Widgets (WidgetKit + control + Live Activity), embebida en PlugIns/.
      - target: AnimaWidgets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Anima
        # Versión desde los build settings: el CD pasa CURRENT_PROJECT_VERSION=run_number.
        # Sin esto XcodeGen escribe los literales "1"/"1.0" e ignora el setting (build clavado en 1).
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Solo HTTPS/ATS estándar (cifrado exento): sin pregunta de compliance en TestFlight.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Sueño (§5.4): el ciclo corre como BGProcessingTask; sin este array el
        # register(forTaskWithIdentifier:) crashea al lanzar (auditoría v1 gap #1).
        # + gafas (DAT, calcado de Relay verificado en hardware): accesorio + BT.
        # + pulso del deseo en background (BGAppRefreshTask mind.anima.pulse): fetch.
        UIBackgroundModes: [processing, fetch, external-accessory, bluetooth-peripheral]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        # Live Activity del sueño en foreground ("… está consolidando" → "Noche #N lista").
        NSSupportsLiveActivities: true
        # URL scheme propio: callback de Meta AI en el registro DAT (handleUrl) y
        # deep link del handoff "ver en el teléfono" (anima://chat?turn=…).
        CFBundleURLTypes:
          - CFBundleURLName: com.joshuamoreno1.anima
            CFBundleURLSchemes: [anima]
        MWDAT:
          AppLinkURLScheme: "anima://"
          MetaAppID: $(MWDAT_META_APP_ID)
          ClientToken: $(MWDAT_CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
        NSBluetoothAlwaysUsageDescription: "Anima se conecta a tus gafas Meta para mostrarte respuestas en la cara y escucharte manos libres."
        NSLocalNetworkUsageDescription: "Las gafas Meta envían la foto que autorizas por Wi-Fi local al teléfono."
        NSBonjourServices: [_bonjour._tcp]
        BGTaskSchedulerPermittedIdentifiers: [mind.anima.consolidate, mind.anima.pulse]
        NSCameraUsageDescription: "Anima usa la cámara solo cuando tú se lo pides o confirmas, para ver y comentar una foto que le muestras."
        NSMicrophoneUsageDescription: "Anima usa el micrófono (del teléfono o de tus gafas) para escucharte cuando tú lo inicias; el audio se transcribe en el teléfono."
        NSSpeechRecognitionUsageDescription: "La transcripción de tus notas de voz ocurre en el dispositivo (es-CO); el audio no sale del teléfono."
        NSCalendarsFullAccessUsageDescription: "Anima lee tu calendario para responder qué tienes agendado y crea eventos solo tras tu confirmación."
        NSRemindersFullAccessUsageDescription: "Anima lee tus recordatorios para ayudarte a no olvidar pendientes y crea nuevos solo tras tu confirmación."
        NSLocationWhenInUseUsageDescription: "Anima usa tu ubicación para dar respuestas con contexto de dónde estás; nunca la comparte."
        # HealthKit: PhoneContextTool referencia las APIs (ITMS-90683 exige el string
        # aunque los paths sean stubs); el acceso real siempre es opt-in del dueño.
        NSHealthShareUsageDescription: "Anima lee datos básicos de salud (pasos, sueño) solo si tú lo permites, para darte contexto en tus conversaciones."
        NSHealthUpdateUsageDescription: "Anima no escribe datos de salud hoy; el permiso existe por las capacidades del asistente y siempre requiere tu autorización explícita."
        NSContactsUsageDescription: "Anima busca en tus contactos cuando necesitas datos de alguien; la información se queda en tu teléfono."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshuamoreno1.anima
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 97VRP2W6B6
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # Sign in with Apple (identidad vía Firebase Auth, proveedor apple.com)
        # + App Group group.com.joshuamoreno1.anima.widgets (base + snapshot de widgets).
        CODE_SIGN_ENTITLEMENTS: Anima.entitlements

  # Extensión de widgets: lee SOLO el snapshot JSON del App Group (jamás GRDB).
  # Comparte con la app App/WidgetsShared (intents, vistas, atributos de la Live
  # Activity). Mismo App Group que la app; bundle id registrado por el dueño.
  AnimaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widgets
      - path: WidgetsShared
    dependencies:
      - package: AnimaKit
        product: AnimaKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Anima
        CFBundleDevelopmentRegion: es
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshuamoreno1.anima.widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 97VRP2W6B6
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: AnimaWidgets.entitlements
        SKIP_INSTALL: YES

  # UI tests (XCUITest) contra el simulador. La app se lanza con `--uitest`
  # (dobles deterministas sin red, ver App/UITestSupport.swift). Categoría aparte
  # del gate de cobertura del package.
  AnimaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
        excludes:
          - "*.md"
    dependencies:
      - target: Anima
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshuamoreno1.anima.uitests
        TEST_TARGET_NAME: Anima
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 97VRP2W6B6
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
