name: Deploy TestFlight
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Merges seguidos: solo deploya el último (cancela el build en curso).
concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  testflight:
    name: Archive + upload a TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Secrets del build (gitignored en el repo)
        env:
          GOOGLE_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
          MWDAT_XCCONFIG_B64: ${{ secrets.MWDAT_SECRETS_XCCONFIG_B64 }}
        run: |
          echo "$GOOGLE_PLIST_B64" | base64 -d > App/GoogleService-Info.plist
          echo "$MWDAT_XCCONFIG_B64" | base64 -d > App/Secrets.xcconfig
      - name: Generate project
        run: xcodegen generate --spec App/project.yml
      - name: API key de App Store Connect (cloud signing)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      # Firma con UN certificado Apple Distribution guardado en secrets (p12): el
      # runner efímero no crea certificados nuevos. Los perfiles los sigue
      # manejando Xcode con la API key (-allowProvisioningUpdates), así una
      # capability nueva en el App ID regenera el perfil sin tocar nada a mano.
      - name: Certificado de distribución (secrets) → keychain temporal
        env:
          DIST_CERT_P12_B64: ${{ secrets.DIST_CERT_P12_B64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DIST_CERT_P12_B64:-}" ] || [ -z "${DIST_CERT_PASSWORD:-}" ]; then
            echo "::error::Faltan los secrets DIST_CERT_P12_B64 / DIST_CERT_PASSWORD" >&2; exit 1
          fi
          KC="$RUNNER_TEMP/anima-signing.keychain-db"
          KC_PW="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$DIST_CERT_P12_B64" | base64 -d > "$P12"
          security import "$P12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Distribution" \
            || { echo "::error::El p12 no trae una identidad Apple Distribution" >&2; exit 1; }
          echo "SIGNING_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Cache SPM (Xcode)
        uses: actions/cache@v4
        with:
          path: .spm-ci
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('App/project.yml', 'Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: Archive (build number = run number)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: >
          xcodebuild -project App/Anima.xcodeproj -scheme Anima
          -destination 'generic/platform=iOS'
          -archivePath build/Anima.xcarchive
          -clonedSourcePackagesDirPath .spm-ci
          -allowProvisioningUpdates
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          archive
      # Firma automática con la API key (-allowProvisioningUpdates): la app
      # (com.joshuamoreno1.anima) y la extensión (com.joshuamoreno1.anima.widgets),
      # ambas con el App Group group.com.joshuamoreno1.anima.widgets. Si el perfil
      # de alguna no trae el grupo, se corta aquí y no se sube un build roto.
      - name: Verificar firma + App Group (app y extensión) + CarPlay (app)
        run: |
          APP=build/Anima.xcarchive/Products/Applications/Anima.app
          APPEX="$APP/PlugIns/AnimaWidgets.appex"
          test -d "$APPEX" || { echo "Falta AnimaWidgets.appex en el archive" >&2; exit 1; }
          for bundle in "$APP" "$APPEX"; do
            codesign --verify --strict "$bundle"
            codesign -dvv "$bundle" 2>&1 | grep -q "Authority=Apple Distribution" \
              || { echo "No está firmado con Apple Distribution: $bundle" >&2; exit 1; }
            codesign -d --entitlements :- "$bundle" 2>/dev/null | grep -q "group.com.joshuamoreno1.anima.widgets" \
              || { echo "Sin App Group en $bundle" >&2; exit 1; }
          done
          # CarPlay (voice-based conversation): el perfil de la app debe traer el
          # entitlement; sin la capacidad en el App ID el archive ya falló arriba.
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q "com.apple.developer.carplay-voice-based-conversation" \
            || { echo "Sin el entitlement de CarPlay en $APP" >&2; exit 1; }
      - name: Export + upload a TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: >
          xcodebuild -exportArchive
          -archivePath build/Anima.xcarchive
          -exportOptionsPlist App/ExportOptions.plist
          -allowProvisioningUpdates
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      # Red de seguridad: con el certificado de distribución de secrets el runner
      # ya no debería crear "Apple Development: Created via API"; si Xcode igual
      # creara uno, se revoca el de ESTE runner (por número de serie).
      - name: Revocar un certificado de desarrollo creado por este runner (si lo hubo)
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: ruby scripts/revoke-run-dev-cert.rb
      - name: Borrar el keychain temporal
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
